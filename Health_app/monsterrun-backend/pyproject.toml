[project]
name = "monsterrun-backend"
version = "0.1.0"
description = "Project MonsterRun — wearable-driven digital monster raising game backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "cryptography>=43.0",          # Fernet token encryption
    "httpx>=0.27",                 # Strava fetch-on-event
    "python-jose[cryptography]>=3.3",  # mobile JWT auth
    "polyline>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
