<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  @font-face{font-family:'NJ';src:url('file:///C:/Windows/Fonts/NotoSansJP-VF.ttf');font-weight:100 900;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1280px;height:720px;overflow:hidden;background:#05080c;position:relative;color:#fff;font-family:'NJ','Yu Gothic UI',sans-serif;}
  .bg{position:absolute;inset:0;background:
    radial-gradient(circle at 15% 15%,rgba(56,189,248,.16),transparent 28%),
    radial-gradient(circle at 85% 20%,rgba(255,109,0,.16),transparent 24%),
    linear-gradient(180deg,#08131c 0%,#05080c 100%);}
  .grid{position:absolute;inset:0;opacity:.06;background-image:
    linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:44px 44px;}
  .edge{position:absolute;left:0;top:0;width:8px;height:100%;background:#38bdf8;}
  .tag{position:absolute;left:60px;top:48px;padding:10px 16px;border-radius:999px;font-size:18px;font-weight:800;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);color:#38bdf8;}
  .title{position:absolute;left:60px;top:118px;width:1100px;font-size:52px;line-height:1.18;font-weight:900;letter-spacing:-.04em;}
  .panel{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:24px;backdrop-filter:blur(12px);}
  .muted{color:#9ca3af}.orange{color:#ff6d00}.blue{color:#38bdf8}.green{color:#4ade80}
  .footer{position:absolute;left:60px;right:60px;bottom:28px;font-size:20px;font-weight:800;color:#d1d5db;}
  .arrow{font-size:42px;font-weight:900;color:#38bdf8;}
  </style></head><body>
  <div class="bg"></div><div class="grid"></div><div class="edge"></div>
  <div class="tag">総合点</div>
  <div class="title">長寿は、<br>裏ワザ1個で勝つ話じゃない。</div>
  <div style="position:absolute;left:60px;right:60px;top:274px;display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div class="panel" style="padding:16px 18px;border-color:#ff6d0044;display:flex;gap:14px;align-items:flex-start;">
        <div style="width:40px;height:40px;border-radius:999px;background:#ff6d00;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#000;flex:0 0 auto;">1</div>
        <div>
          <div style="font-size:24px;font-weight:900;line-height:1.35;">睡眠</div>
          <div class="muted" style="font-size:17px;line-height:1.6;margin-top:6px;">食欲と運動の土台。</div>
        </div>
      </div>
      <div class="panel" style="padding:16px 18px;border-color:#38bdf844;display:flex;gap:14px;align-items:flex-start;">
        <div style="width:40px;height:40px;border-radius:999px;background:#38bdf8;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#000;flex:0 0 auto;">2</div>
        <div>
          <div style="font-size:24px;font-weight:900;line-height:1.35;">食事時間</div>
          <div class="muted" style="font-size:17px;line-height:1.6;margin-top:6px;">夜を閉じる。</div>
        </div>
      </div>
      <div class="panel" style="padding:16px 18px;border-color:#4ade8044;display:flex;gap:14px;align-items:flex-start;">
        <div style="width:40px;height:40px;border-radius:999px;background:#4ade80;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#000;flex:0 0 auto;">3</div>
        <div>
          <div style="font-size:24px;font-weight:900;line-height:1.35;">筋トレ</div>
          <div class="muted" style="font-size:17px;line-height:1.6;margin-top:6px;">筋肉を守る。</div>
        </div>
      </div>
      <div class="panel" style="padding:16px 18px;border-color:#ff6d0044;display:flex;gap:14px;align-items:flex-start;">
        <div style="width:40px;height:40px;border-radius:999px;background:#ff6d00;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#000;flex:0 0 auto;">4</div>
        <div>
          <div style="font-size:24px;font-weight:900;line-height:1.35;">禁煙</div>
          <div class="muted" style="font-size:17px;line-height:1.6;margin-top:6px;">人によっては最優先。</div>
        </div>
      </div></div>
  <div class="footer">今週は全部ではなく、3つに絞る方が続く。</div>
  </body></html>
