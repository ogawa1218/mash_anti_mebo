<!DOCTYPE html>
  <html><head><meta charset="UTF-8"><style>
  @font-face{font-family:'NJ';src:url('file:///C:/Windows/Fonts/NotoSansJP-VF.ttf');font-weight:100 900;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1280px;height:670px;overflow:hidden;position:relative;background:#05080c;color:#fff;
  font-family:'NJ','Yu Gothic UI',sans-serif;}
  .bg{position:absolute;inset:0;background:
    radial-gradient(circle at 16% 18%,rgba(56,189,248,.18),transparent 28%),
    radial-gradient(circle at 82% 16%,rgba(255,109,0,.18),transparent 26%),
    linear-gradient(180deg,#08131c 0%,#05080c 100%);}
  .grid{position:absolute;inset:0;opacity:.06;background-image:
    linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
    background-size:40px 40px;}
  .frame{position:absolute;inset:28px;border:1px solid rgba(255,255,255,.08);border-radius:28px;}
  .title{position:absolute;left:48px;top:42px;font-size:44px;font-weight:900;letter-spacing:-.03em;}
  .label{position:absolute;left:48px;top:18px;font-size:14px;font-weight:800;letter-spacing:.18em;color:#ff6d00;}
  .panel{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:24px;backdrop-filter:blur(12px);}
  .muted{color:#9ca3af}.orange{color:#ff6d00}.blue{color:#38bdf8}.green{color:#4ade80}
  .brand{position:absolute;right:44px;bottom:28px;font-size:16px;color:#9ca3af;}
  </style></head><body>
  <div class="bg"></div><div class="grid"></div><div class="frame"></div>
  <div class="label">MARCY CONTENT</div><div class="title">卵先食べ 1週間プロトコル</div>
  
      
        <div class="panel" style="position:absolute;left:80px;top:150px;width:500px;height:138px;border-color:#ff6d0055;">

            <div style="width:56px;height:56px;border-radius:50%;background:#ff6d00;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#000;">1</div>
            <div><div style="font-size:28px;font-weight:900;line-height:1.3;">朝いちで卵2個</div>
            <div class="muted" style="font-size:18px;line-height:1.6;margin-top:6px;">主食より先に入れる</div></div>
          </div>
        </div>
        <div class="panel" style="position:absolute;left:640px;top:150px;width:500px;height:138px;border-color:#38bdf855;">

            <div style="width:56px;height:56px;border-radius:50%;background:#38bdf8;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#000;">2</div>

        </div>

            <div style="width:56px;height:56px;border-radius:50%;background:#ff6d00;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#000;">3</div>
            <div><div style="font-size:28px;font-weight:900;line-height:1.3;">味噌汁か無糖飲料</div>

        </div>
        <div class="panel" style="position:absolute;left:640px;top:330px;width:500px;height:138px;border-color:#38bdf855;">

            <div style="width:56px;height:56px;border-radius:50%;background:#38bdf8;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#000;">4</div>
            <div><div style="font-size:28px;font-weight:900;line-height:1.3;">4項目だけ記録</div>
            <div class="muted" style="font-size:18px;line-height:1.6;margin-top:6px;">間食欲・眠気・だるさ・続けやすさ</div></div>
          </div>
        </div>
      <div style="position:absolute;left:160px;right:160px;bottom:58px;text-align:center;font-size:24px;font-weight:800;">
