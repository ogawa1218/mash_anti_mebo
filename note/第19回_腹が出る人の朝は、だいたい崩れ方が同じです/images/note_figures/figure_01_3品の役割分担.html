<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  @font-face{font-family:'NJ';src:url('file:///C:/Windows/Fonts/NotoSansJP-VF.ttf');font-weight:100 900;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1280px;height:670px;overflow:hidden;position:relative;background:#05080c;color:#fff;font-family:'NJ','Yu Gothic UI',sans-serif;}
  .bg{position:absolute;inset:0;background:
    radial-gradient(circle at 16% 18%,rgba(56,189,248,.18),transparent 28%),
    radial-gradient(circle at 82% 16%,rgba(255,109,0,.18),transparent 26%),
    linear-gradient(180deg,#08131c 0%,#05080c 100%);}
  .grid{position:absolute;inset:0;opacity:.06;background-image:
    linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:40px 40px;}
  .frame{position:absolute;inset:28px;border:1px solid rgba(255,255,255,.08);border-radius:28px;}
  .title{position:absolute;left:48px;top:42px;font-size:44px;font-weight:900;letter-spacing:-.03em;}
  .label{position:absolute;left:48px;top:18px;font-size:14px;font-weight:800;letter-spacing:.18em;color:#ff6d00;}
  .panel{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:24px;backdrop-filter:blur(12px);}
  .muted{color:#9ca3af}.orange{color:#ff6d00}.blue{color:#38bdf8}.green{color:#4ade80}
  </style></head><body>
  <div class="bg"></div><div class="grid"></div><div class="frame"></div>
  <div class="label">MARCY CONTENT</div><div class="title">もち麦・納豆・卵は、役割分担で見ると強い</div>
  <div class='panel' style='position:absolute;left:90px;top:170px;width:300px;height:280px;padding:24px;border-color:#ff6d0055;'><div class='orange' style='font-size:24px;font-weight:900;'>もち麦</div><div style='font-size:32px;font-weight:900;line-height:1.35;margin-top:16px;'>食物繊維<br>β-グルカン</div><div class='muted' style='font-size:18px;line-height:1.6;margin-top:18px;'>朝から血糖を暴れさせにくい</div></div><div class='panel' style='position:absolute;left:490px;top:170px;width:300px;height:280px;padding:24px;border-color:#38bdf855;'><div class='blue' style='font-size:24px;font-weight:900;'>納豆</div><div style='font-size:32px;font-weight:900;line-height:1.35;margin-top:16px;'>発酵食品<br>大豆たんぱく</div><div class='muted' style='font-size:18px;line-height:1.6;margin-top:18px;'>発酵を毎日入れやすい</div></div><div class='panel' style='position:absolute;right:90px;top:170px;width:300px;height:280px;padding:24px;border-color:#4ade8055;'><div class='green' style='font-size:24px;font-weight:900;'>卵</div><div style='font-size:32px;font-weight:900;line-height:1.35;margin-top:16px;'>たんぱく質<br>実行しやすい</div><div class='muted' style='font-size:18px;line-height:1.6;margin-top:18px;'>忙しい朝でも成立しやすい</div></div>
  </body></html>
