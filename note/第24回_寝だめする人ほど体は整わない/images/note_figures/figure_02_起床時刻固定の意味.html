<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  @font-face{font-family:'NJ';src:url('file:///C:/Windows/Fonts/NotoSansJP-VF.ttf');font-weight:100 900;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1280px;height:670px;overflow:hidden;position:relative;background:#05080c;color:#fff;font-family:'NJ','Yu Gothic UI',sans-serif;}
  .bg{position:absolute;inset:0;background:
    radial-gradient(circle at 16% 18%,rgba(56,189,248,.18),transparent 28%),
    radial-gradient(circle at 82% 16%,rgba(255,109,0,.18),transparent 26%),
    linear-gradient(180deg,#08131c 0%,#05080c 100%);}
  .grid{position:absolute;inset:0;opacity:.06;background-image:
    linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:40px 40px;}
  .frame{position:absolute;inset:28px;border:1px solid rgba(255,255,255,.08);border-radius:28px;}
  .title{position:absolute;left:48px;top:42px;font-size:44px;font-weight:900;letter-spacing:-.03em;}
  .label{position:absolute;left:48px;top:18px;font-size:14px;font-weight:800;letter-spacing:.18em;color:#ff6d00;}
  .panel{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:24px;backdrop-filter:blur(12px);}
  .muted{color:#9ca3af}.orange{color:#ff6d00}.blue{color:#38bdf8}.green{color:#4ade80}
  </style></head><body>
  <div class="bg"></div><div class="grid"></div><div class="frame"></div>
  <div class="label">MARCY CONTENT</div><div class="title">最初に固定すべきは、寝る時刻より起きる時刻</div>
  <div class='panel' style='position:absolute;left:140px;top:180px;width:420px;height:240px;padding:28px;border-color:#38bdf855;'><div class='blue' style='font-size:24px;font-weight:900;'>起床時刻固定</div><div style='font-size:42px;font-weight:900;line-height:1.3;margin-top:18px;'>平日も休日も<br>大きくズラさない</div><div class='muted' style='font-size:20px;line-height:1.6;margin-top:18px;'>6:30でも7:00でもいい。まず決める。</div></div><div style='position:absolute;left:604px;top:260px;font-size:60px;font-weight:900;color:#ff6d00;'>→</div><div class='panel' style='position:absolute;right:140px;top:180px;width:420px;height:240px;padding:28px;border-color:#4ade8055;'><div class='green' style='font-size:24px;font-weight:900;'>体内時計</div><div style='font-size:42px;font-weight:900;line-height:1.3;margin-top:18px;'>夜の眠気と<br>朝のだるさが整いやすい</div><div class='muted' style='font-size:20px;line-height:1.6;margin-top:18px;'>起床時刻固定と朝の光はセット。</div></div>
