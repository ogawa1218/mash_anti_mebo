<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  @font-face{font-family:'NJ';src:url('file:///C:/Windows/Fonts/NotoSansJP-VF.ttf');font-weight:100 900;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1280px;height:720px;overflow:hidden;background:#05080c;position:relative;color:#fff;font-family:'NJ','Yu Gothic UI',sans-serif;}
  .bg{position:absolute;inset:0;background:
    radial-gradient(circle at 15% 15%,rgba(56,189,248,.16),transparent 28%),
    radial-gradient(circle at 85% 20%,rgba(255,109,0,.16),transparent 24%),
    linear-gradient(180deg,#08131c 0%,#05080c 100%);}
  .grid{position:absolute;inset:0;opacity:.06;background-image:
    linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:44px 44px;}
  .edge{position:absolute;left:0;top:0;width:8px;height:100%;background:#38bdf8;}
  .tag{position:absolute;left:60px;top:48px;padding:10px 16px;border-radius:999px;font-size:18px;font-weight:800;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);color:#38bdf8;}
  .title{position:absolute;left:60px;top:118px;width:1100px;font-size:52px;line-height:1.18;font-weight:900;letter-spacing:-.04em;}
  .panel{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:24px;backdrop-filter:blur(12px);}
  .muted{color:#9ca3af}.orange{color:#ff6d00}.blue{color:#38bdf8}.green{color:#4ade80}
  .footer{position:absolute;left:60px;right:60px;bottom:28px;font-size:20px;font-weight:800;color:#d1d5db;}
  .arrow{font-size:42px;font-weight:900;color:#38bdf8;}
  </style></head><body>
  <div class="bg"></div><div class="grid"></div><div class="edge"></div>
  <div class="tag">仕組み</div>
  <div class="title">食後10分歩くと、<br>筋肉が糖を使いやすい。</div>
  <div style="position:absolute;left:60px;right:60px;top:290px;display:flex;align-items:center;justify-content:space-between;gap:16px;">
      <div class="panel" style="width:220px;min-height:150px;padding:18px 16px;border-color:#ff6d0055;box-shadow:0 0 24px #ff6d0022;">
        <div style="display:flex;align-items:center;justify-content:center;margin-bottom:10px;"><svg viewBox="0 0 64 64" width="52" height="52" fill="none"><path d="M36 8 18 34h12l-2 22 18-26H34l2-22Z" fill="#ff6d00" fill-opacity=".18" stroke="#ff6d00" stroke-width="3" stroke-linejoin="round"/></svg></div>
        <div style="font-size:24px;font-weight:900;line-height:1.35;text-align:center;">筋肉が動く</div>
        
      </div>
      <div class="arrow">→</div>
      <div class="panel" style="width:220px;min-height:150px;padding:18px 16px;border-color:#38bdf855;box-shadow:0 0 24px #38bdf822;">
        <div style="display:flex;align-items:center;justify-content:center;margin-bottom:10px;"><svg viewBox="0 0 64 64" width="52" height="52" fill="none"><path d="M12 50h40" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/><path d="m16 42 10-12 8 6 14-16" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="42" r="3" fill="#38bdf8"/><circle cx="26" cy="30" r="3" fill="#38bdf8"/><circle cx="34" cy="36" r="3" fill="#38bdf8"/><circle cx="48" cy="20" r="3" fill="#38bdf8"/></svg></div>
        <div style="font-size:24px;font-weight:900;line-height:1.35;text-align:center;">血糖ピークを抑えやすい</div>
        
      </div>
      <div class="arrow">→</div>
      <div class="panel" style="width:220px;min-height:150px;padding:18px 16px;border-color:#4ade8055;box-shadow:0 0 24px #4ade8022;">
        <div style="display:flex;align-items:center;justify-content:center;margin-bottom:10px;"><svg viewBox="0 0 64 64" width="52" height="52" fill="none"><circle cx="32" cy="32" r="22" stroke="#4ade80" stroke-width="3" fill="#4ade80" fill-opacity=".12"/><path d="m22 33 7 7 14-16" stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div style="font-size:24px;font-weight:900;line-height:1.35;text-align:center;">眠気とだるさが軽い</div>
        
      </div>
      </div>
  <div class="footer">軽い歩行でも成立する。</div>
  </body></html>
